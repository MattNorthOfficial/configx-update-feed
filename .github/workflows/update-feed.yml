name: Update feed

on:
  workflow_dispatch:
    inputs:
      board_vendors:
        description: "Motherboard vendors to sweep (comma-separated: msi,gigabyte,asrock,asus; 'none' skips all). Empty = all; skipped vendors carry forward."
        required: false
        default: ""
  schedule:
    # Every 6 hours: just the quick sections (AMD/NVIDIA/Intel/Windows) -
    # board entries carry forward untouched. BIOS releases are rare, so the
    # ~2,900-page board sweep runs once nightly instead, which also keeps
    # the vendor sites from seeing four full crawls a day.
    - cron: "0 */6 * * *"
    - cron: "30 3 * * *"

permissions:
  contents: write

# Overlapping runs would race the feed commit; queue instead.
concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scrape latest driver versions
        shell: pwsh
        run: |
          $vendors = '${{ inputs.board_vendors }}'
          if ('${{ github.event.schedule }}' -eq '0 */6 * * *') {
            $vendors = 'none'
          }
          if ($vendors) {
            ./scripts/Update-Feed.ps1 -BoardVendors ($vendors -split ',')
          }
          else {
            ./scripts/Update-Feed.ps1
          }

      - name: Commit feed if changed
        run: |
          if git diff --quiet -- feed/updates.json; then
            echo "Feed unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/updates.json
          git commit -m "Update feed"
          git push
