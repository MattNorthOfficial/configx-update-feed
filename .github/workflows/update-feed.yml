name: Update feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape latest driver versions
        shell: pwsh
        run: ./scripts/Update-Feed.ps1

      - name: Commit feed if changed
        run: |
          if git diff --quiet -- feed/updates.json; then
            echo "Feed unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/updates.json
          git commit -m "Update feed"
          git push
