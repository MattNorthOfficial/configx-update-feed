name: Update feed

on:
  workflow_dispatch:
    inputs:
      board_vendors:
        description: "Motherboard vendors to sweep (comma-separated: msi,gigabyte,asrock,asus; 'none' skips all). Empty = all; skipped vendors carry forward."
        required: false
        default: ""
      accept_date_regressions:
        description: "Publish even if many BIOS dates move backwards. Only for a deliberate change to what counts as the latest BIOS - the gate is right to refuse otherwise."
        type: boolean
        required: false
        default: false
  schedule:
    # Every 6 hours: just the quick sections (AMD/NVIDIA/Intel/Windows) -
    # board entries carry forward untouched. BIOS releases are rare, so the
    # ~2,900-page board sweep runs once daily instead, which also keeps
    # the vendor sites from seeing four full crawls a day. The sweep runs
    # at 10:37 UTC, right after the Taiwanese workday ends - all four
    # board vendors publish from Taiwan - so each day's BIOS releases are
    # in the feed before the European evening. Odd minutes on purpose:
    # GitHub delays cron jobs scheduled at busy exact-hour marks.
    #
    # The 6-hourly expression is matched literally below, both to give the
    # quick run its own queue and to drop the board sweep from it, so those
    # copies have to move together if it ever changes.
    - cron: "37 */6 * * *"
    - cron: "37 10 * * *"

permissions:
  contents: write

# The quick refresh and the full sweep queue independently. Sharing one group
# meant a slow sweep parked the 6-hourly run behind it for hours, and a third
# run joining the group evicted whichever was already waiting - the 6-hourly
# run was dropped without running at all more than once. The two can now
# overlap, so the publish step below settles the rare collision rather than
# the queue doing it by starving one side.
concurrency:
  group: "update-feed-${{ github.event.schedule == '37 */6 * * *' && 'quick' || 'full' }}"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A backstop, not a target: the script budgets each vendor phase, so even
    # a badly rate-limited sweep gives up and publishes what it has. Reaching
    # the runner's own six-hour ceiling only ever meant a stalled run sitting
    # on the slot and publishing nothing.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test parser helpers
        shell: pwsh
        run: ./scripts/Test-FeedParsing.ps1

      - name: Test feed signing
        shell: pwsh
        run: ./scripts/Test-FeedSigning.ps1

      - name: Test publication merge
        shell: pwsh
        run: ./scripts/Test-MergeFeedPublication.ps1

      - name: Scrape latest driver versions
        shell: pwsh
        env:
          BOARD_VENDORS_INPUT: ${{ inputs.board_vendors }}
          ACCEPT_DATE_REGRESSIONS_INPUT: ${{ inputs.accept_date_regressions }}
          RUN_SCHEDULE: ${{ github.event.schedule }}
        run: |
          $vendors = @($env:BOARD_VENDORS_INPUT -split ',' |
            ForEach-Object { $_.Trim().ToLowerInvariant() } |
            Where-Object { $_ })
          if ($env:RUN_SCHEDULE -eq '37 */6 * * *') {
            $vendors = @('none')
          }
          elseif ($vendors.Count -eq 0) {
            $vendors = @('msi', 'gigabyte', 'asrock', 'asus')
          }
          # Only a run that swept every vendor holds a complete feed, which
          # decides whether it may republish over a run that landed while it
          # worked. Recorded from what was actually swept rather than from
          # which schedule fired, so a hand-triggered partial run is judged
          # the same way a 6-hourly one is.
          $normalized = @($vendors | Sort-Object -Unique)
          $fullSweep = $normalized.Count -eq 4 -and
            -not (Compare-Object $normalized @('asrock', 'asus', 'gigabyte', 'msi'))
          "FULL_SWEEP=$($fullSweep.ToString().ToLower())" | Out-File $env:GITHUB_ENV -Append
          # Scheduled runs never carry the override: it exists for a hand-
          # triggered run that is landing a deliberate change.
          $accept = $env:ACCEPT_DATE_REGRESSIONS_INPUT -eq 'true'
          ./scripts/Update-Feed.ps1 -BoardVendors $vendors -AcceptDateRegressions:$accept

      - name: Validate consumer contract
        shell: pwsh
        run: ./scripts/Test-FeedContract.ps1 -SkipSignature

      - name: Sign and verify feed
        shell: pwsh
        env:
          FEED_SIGNING_KEY_PEM: ${{ secrets.FEED_SIGNING_KEY_PEM }}
        run: |
          git diff --quiet -- feed/updates.json
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path feed/updates.sig)) {
            ./scripts/Sign-Feed.ps1
          }
          ./scripts/Verify-FeedSignature.ps1

      # Now that the two run types can overlap, one can publish while the other
      # is still working. A full sweep owns the motherboard sections, but a
      # later quick run may have fresher driver/Windows data; the collision
      # path merges those two sources. A run that carried boards forward must
      # not replay - that would undo a sweep's work - so it yields and lets
      # the next run carry its change instead.
      - name: Commit feed if changed
        env:
          FEED_SIGNING_KEY_PEM: ${{ secrets.FEED_SIGNING_KEY_PEM }}
        run: |
          if git diff --quiet -- feed/updates.json feed/updates.sig; then
            echo "Feed unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp feed/updates.json "$RUNNER_TEMP/updates.json"

          for attempt in 1 2 3; do
            git add feed/updates.json feed/updates.sig
            git commit -m "Update feed"
            if git push; then
              exit 0
            fi

            git fetch origin "$GITHUB_REF_NAME"
            if [ "$FULL_SWEEP" != "true" ]; then
              echo "Another run published while this refresh ran; yielding to it."
              exit 0
            fi

            git reset --hard "origin/$GITHUB_REF_NAME"
            pwsh ./scripts/Merge-FeedPublication.ps1 \
              -BoardFeedPath "$RUNNER_TEMP/updates.json" \
              -LatestFeedPath feed/updates.json \
              -OutputPath feed/updates.json
            pwsh ./scripts/Test-FeedContract.ps1 -SkipSignature
            pwsh ./scripts/Sign-Feed.ps1
            pwsh ./scripts/Verify-FeedSignature.ps1
            if git diff --quiet -- feed/updates.json feed/updates.sig; then
              echo "Feed already current."
              exit 0
            fi
          done

          echo "Could not publish after 3 attempts." >&2
          exit 1
